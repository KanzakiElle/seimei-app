<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>安倍晴明・AI六壬神課</title>
  <style>
    body { background: #0c0d1a; color: #e2e8f0; font-family: sans-serif; padding: 15px; text-align: center; margin: 0; }
    .app-container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 1.4rem; color: #c084fc; text-shadow: 0 0 10px rgba(192,132,252,0.4); margin-bottom: 5px; }
    .subtitle { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; }
    /* 入力欄のデザイン */
    .input-box { width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px; border: 2px solid #4c1d95; background: #1e1b4b; color: #fff; box-sizing: border-box; margin-bottom: 15px; }
    button { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: 1px solid #c084fc; padding: 15px; font-size: 1.1rem; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; }
    .hidden { display: none; }
    .info-pane { margin: 15px 0; font-size: 0.85rem; background: #13152c; padding: 10px; border-radius: 10px; border: 1px solid #334155; }
    .ai-bubble { background: #2e1065; border: 1px dashed #a855f7; padding: 15px; border-radius: 12px; text-align: left; margin: 15px 0; font-size: 0.9rem; line-height: 1.5; color: #e9d5ff; }
    .card { background: #151833; border-radius: 16px; padding: 15px; margin: 15px 0; text-align: left; border-left: 6px solid #6366f1; }
    .card-shoden { border-left-color: #38bdf8; } .card-chuden { border-left-color: #fb7185; } .card-maiden { border-left-color: #34d399; }
    .badge { font-size: 0.75rem; background: #24294d; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 5px; color: #a78bfa; font-weight: bold; }
    .card h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: #fff; }
    .desc { margin: 5px 0 0 0; font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>

<div class="app-container">
  <h1>🌌 安倍晴明・AI六壬解読課 🌌</h1>
  <p class="subtitle">あなたの悩みに合わせて式神が未来を翻訳する</p>
  
  <!-- 悩み入力欄 -->
  <input type="text" id="user-query" class="input-box" placeholder="例：頭が痛いけど治る？ / 恋愛 / 仕事" value="頭が痛いけど治る？">
  <button id="divine-btn">✨ 占事略決・AI自動解読！ ✨</button>

  <div id="result-box" class="hidden">
    <div class="info-pane">占時：<span id="txt-time"></span>（<span id="txt-jishi"></span>刻）</div>
    
    <!-- AIによる総合解読バブル -->
    <div class="ai-bubble">
      <strong>🔮 安倍晴明によるAI総合解読リポート：</strong><br>
      <span id="ai-report"></span>
    </div>

    <div class="card card-shoden">
      <div class="badge">初伝：問題の原因</div>
      <h3 id="t1-name"></h3><p class="desc" id="t1-desc"></p>
    </div>
    <div class="card card-chuden">
      <div class="badge">中伝：宿命の経過</div>
      <h3 id="t2-name"></h3><p class="desc" id="t2-desc"></p>
    </div>
    <div class="card card-maiden">
      <div class="badge">末伝：必然の結末</div>
      <h3 id="t3-name"></h3><p class="desc" id="t3-desc"></p>
    </div>
  </div>
</div>

<script>
const tenshoData = {
  "玄武": { n: "🐦‍⬛ 玄武 (ゲンブ)", health: "【潜伏する疲れ】体に見えないダメージやストレスが隠れている原因。自分に嘘をつかず休めという警告。", love: "【秘密・隠し事】相手に言えない本音や、浮気・嘘が紛れ込んでいる暗示。甘い言葉を警戒せよ。", general: "【盗難・ウソ】詐欺や紛失への強い警告。調子の良い話には裏があります。" },
  "白虎": { n: "🐅 白虎 (ビャッコ)", health: "【激しい痛みのピーク】今まさに嵐の真っ只中。強引に動くと怪我をするので、薬を飲んでじっと静かに過ごせ。", love: "【激しい衝突】喧嘩や感情の爆発が起きる予兆。今は牙を剥かず、相手の怒りの嵐が過ぎ去るのを待つのが正解。", general: "【突然のトラブル】アクシデントの予兆。短気な行動は致命的な大損害に繋がります。" },
  "六合": { n: "🛡️ 六合 (リクゴウ)", health: "【医療・薬との和合】専門医や適切な薬といった有能なパートナーと出会い、しっかり並走してもらうことで綺麗に完治します。", love: "【素晴らしい契約・絆】二人の関係が公式に結ばれる大吉のサイン。対話を大切にすれば最高の結末へ。", general: "【協力者との出会い】素晴らしいビジネスパートナーや契約が結ばれるサイン。信頼関係が鍵。" },
  "青龍": { n: "👑 青龍 (セイリュウ)", health: "【生命力のブースト】みなぎるエネルギーで回復へ向かう大吉の兆し。外に出て日光を浴びるとさらに運気アップ。", love: "【最高潮の進展】相手を惹きつける強い魅力。自信を持ってあなたからアプローチすれば成功は確実。", general: "【圧倒的成功】富と大勝利をもたらす最強の味方。迷わず即座に攻めに転じるのが大吉。" }
};
const defaultTensho = [
  { n: "✨ 貴人 (キジン)", g: "あらゆる災厄を消し去る最上級の守護神。目上のバックアップが入ります。" },
  { n: "🔥 朱雀 (スザク)", g: "注目度が跳ね上がるサイン。ただし噂話や言葉のトラブルに注意。" },
  { n: "👩‍⚕️ 天后 (テンコウ)", g: "深い癒やしの刻。自分が目立つより、誰かのサポートに回ると安定します。" },
  { n: "🔮 太陰 (タイイン)", g: "水面下であなたを助ける秘密の力が動いている兆し。直感を信じて吉。" }
];

document.getElementById("divine-btn").addEventListener("click", () => {
  const query = document.getElementById("user-query").value;
  let type = "general";
  if (query.match(/(痛|病|治|体|健康|風邪|頭)/)) type = "health";
  else if (query.match(/(恋|愛|好き|彼|彼女|結婚|復縁)/)) type = "love";

  const now = new Date();
  let seed = now.getMinutes() + now.getSeconds();
  
  // 今回の3枚（玄武・白虎・六合）を固定しつつ、悩みに応じてテキストをAI変化させるロジック
  const order = ["玄武", "白虎", "六合"];
  let report = "";

  if (type === "health") {
    report = "「この病は体に潜伏せし疲れ（玄武）が原因なり。今まさに痛みの嵐（白虎）が荒れ狂うピークなれば、決して無理を強行することなかれ。のちに医療や良薬という頼もしき伴侶（六合）と巡り合い、全力の並走を得て綺麗に調和（完治）へと向かう必然のタイムラインなり」";
  } else if (type === "love") {
    report = "「この恋、相手の心に隠し事や嘘（玄武）が紛れ込む恐れあり。道中、感情が激しく衝突する嵐（白虎）を迎えるが、お互いに牙を剥かず耐え忍べば、最終的には素晴らしい絆の契約（六合）が結ばれる。対話を諦めぬことが大吉への道なり」";
  } else {
    report = "「事の始まりに隠れたリスクや欺瞞（玄武）あり。進むうちに突然の激しいトラブルの嵐（白虎）に衝突するが、強引な突破を避けて時を待てば、最終的には有能な協力者（六合）との出会いによって事態は素晴らしい結末へと落ち着くナリ」";
  }

  document.getElementById("txt-time").innerText = now.toLocaleTimeString();
  document.getElementById("txt-jishi").innerText = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"][Math.floor(((now.getHours()+1)%24)/2)];
  document.getElementById("ai-report").innerText = report;

  for(let i=0; i<3; i++) {
    let t = tenshoData[order[i]];
    document.getElementById(`t${i+1}-name`).innerText = t.n;
    document.getElementById(`t${i+1}-desc`).innerText = t[type];
  }
  document.getElementById("result-box").classList.remove("hidden");
});
</script>
</body>
</html>
