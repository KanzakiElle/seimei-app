<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>安倍晴明・六壬神課式盤</title>
  <style>
    body { background: #141311; color: #e5e1da; font-family: serif; padding: 15px; text-align: center; margin: 0; }
    .shikiban-area { position: relative; width: 240px; height: 240px; margin: 0 auto 20px auto; background: #f1ebd9; border: 8px solid #3a352a; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .tenban { width: 180px; height: 180px; border: 4px solid #5c1e1e; border-radius: 50%; background: #eddcb9; position: relative; transition: transform 2s ease-out; }
    .jishi-label { position: absolute; width: 20px; height: 20px; font-size: 0.8rem; font-weight: bold; color: #2b251a; text-align: center; line-height: 20px; }
    .divine-btn { background: linear-gradient(135deg, #5c1e1e, #2b1111); color: #d4af37; border: 2px solid #8a6d3b; padding: 15px; font-size: 1rem; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
    .hidden { display: none; }
    .info-pane { margin: 15px 0; font-size: 0.85rem; background: #22201c; padding: 10px; border-radius: 6px; border: 1px solid #423d33; }
    .washi-card { background: #f7f4eb; color: #1c1a17; border-radius: 8px; padding: 15px; margin: 15px 0; text-align: left; border-left: 6px solid #5c1e1e; opacity: 0; transform: translateY(10px); transition: all 0.5s ease; }
    .washi-card.reveal { opacity: 1; transform: translateY(0); }
    .kanji-badge { font-size: 0.7rem; background: #3a352a; color: #f1ebd9; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }
    .chara-title { margin: 0 0 5px 0; font-size: 1.1rem; color: #2b251a; border-bottom: 1px dashed #ad9e82; }
    .sumie-desc { margin: 5px 0 0 0; font-size: 0.85rem; color: #3a352a; line-height: 1.4; }
  </style>
</head>
<body>

  <h1>🌌 安倍晴明・六壬式盤 🌌</h1>
  <p style="font-size:0.75rem; color:#a8a297; margin-top:-5px;">― 天人相関・式神天命可視システム ―</p>
  
  <div class="shikiban-area">
    <div class="tenban" id="main-tenban">
      <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:0.7rem; font-weight:bold; color:#3a352a;">式盤</div>
      <div id="tenban-labels"></div>
    </div>
  </div>

  <button class="divine-btn" id="divine-btn">転天盤・謹解急急如律令！</button>

  <div id="result-box" class="hidden">
    <div class="info-pane">占時：<span id="txt-time"></span>（<span id="txt-jishi"></span>刻） | 空亡：戌・亥</div>
    <div class="washi-card" id="c1"><div class="kanji-badge">初伝（事の端緒）</div><h3 class="chara-title" id="t1-name"></h3><p class="sumie-desc" id="t1-desc"></p></div>
    <div class="washi-card" id="c2"><div class="kanji-badge">中伝（事の経緯）</div><h3 class="chara-title" id="t2-name"></h3><p class="sumie-desc" id="t2-desc"></p></div>
    <div class="washi-card" id="c3"><div class="kanji-badge">末伝（事の帰結）</div><h3 class="chara-title" id="t3-name"></h3><p class="sumie-desc" id="t3-desc"></p></div>
  </div>

<script>
const tenshoData = [
  { n: "貴人 (キジン) [土]", d: "【天将の総帥・霊獣】気品高き守護神が降臨。すべての災いを目にみえぬ彼方へ消し去る大吉の気。周囲の引き立てを得る必然。" },
  { n: "螣蛇 (トウダ) [火]", d: "【猛火の翼蛇】水墨画の濃淡から怪しく這い出る炎の大蛇。予期せぬ衝撃や精神を大きく揺さぶる不可解な変異の前触れ。冷静を要す。" },
  { n: "朱雀 (スザク) [火]", d: "【深紅の霊鳥】極彩色の翼を広げ天を舞う不死鳥。良くも悪くも隠し事が露見し光が当たる。公の発言や噂話には細心の注意を。" },
  { n: "六合 (リクゴウ) [木]", d: "【平穏の和獣】古風な和の意匠を纏う穏やかな霊獣。人と人との絆、大吉なる契約、和合が静かに結ばれる。調和を重んじよ。" },
  { n: "勾陳 (コウチン) [土]", d: "【古強者の霊麒麟】鱗を硬く閉ざし大地を睨む堅牢な獣。物事が膠着し引き止められる障害の予兆。無理に進まず足元を固めよ。" },
  { n: "青竜 (セイリュウ) [木]", d: "【蒼天の巨龍】雲海を割り雷鳴と共に昇る大龍。勢い極まる最高の発展と富をもたらす。これまでの努力が成果となる必然の兆し。" },
  { n: "天空 (テンクウ) [土]", d: "【空無の霧獣】姿を持たず霧の如く漂う実体のない霧獣。虚偽や中身のない計画の警告。一度虚心に立ち返り計画を練り直す時。" },
  { n: "白虎 (ビャッコ) [金]", d: "【金剛の猛虎】岩をも砕く鋭い爪を持つ白き虎。突発的なアクシデントや激しい変化を伴う荒波。牙に立ち向かわず嵐をやり過ごせ。" },
  { n: "太常 (タイジョウ) [土]", d: "【和楽の瑞獣】慶事を呼び込むおっとりとした霊獣。ささやかなご褒美、会食、日常の和やかな幸福。周囲を喜ばせる行動に吉あり。" },
  { n: "玄武 (ゲンブ) [水]", d: "【漆黒の蛇亀】重厚な甲羅に蛇が巻き付く陰湿なる獣。暗がりからの盗難、紛失、ウソや欺瞞への警告。警戒を怠るな。" },
  { n: "太陰 (タイイン) [金]", d: "【隠月の密獣】月の光に紛れて姿を隠す白狐の如き獣。目に見えぬ裏事情や隠された真実。水面下であなたを助ける秘密の力が動く。" },
  { n: "天后 (テンコウ) [水]", d: "【優美なる神女】波間に佇み静かに祈りを捧げる慈愛の女神。陰ながらのサポートや深い癒やしの刻。自己主張を抑えることで運気が安定。" }
];
const jishiList = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const labels = document.getElementById("tenban-labels");
for(let i=0; i<12; i++) {
  let angle = (i * 30 - 90) * (Math.PI / 180);
  labels.innerHTML += `<div class="jishi-label" style="left:${90+70*Math.cos(angle)-10}px; top:${90+70*Math.sin(angle)-10}px;">${jishiList[i]}</div>`;
}
let rot = 0;
document.getElementById("divine-btn").addEventListener("click", () => {
  const now = new Date();
  rot += 720 + (now.getMinutes() * 10);
  document.getElementById("main-tenban").style.transform = `rotate(${-rot}deg)`;
  
  let seed = now.getMinutes() + now.getSeconds();
  let deck = [...tenshoData];
  let res = [];
  for (let i=0; i<3; i++) {
    let idx = (seed + i * 7) % deck.length;
    res.push(deck.splice(idx, 1)[0]);
  }
  
  document.getElementById("txt-time").innerText = now.toLocaleTimeString();
  document.getElementById("txt-jishi").innerText = jishiList[Math.floor(((now.getHours()+1)%24)/2)];
  
  for(let i=0; i<3; i++) {
    document.getElementById(`t${i+1}-name`).innerText = res[i].n;
    document.getElementById(`t${i+1}-desc`).innerText = res[i].d;
    document.getElementById(`c${i+1}`).classList.remove("reveal");
  }
  
  setTimeout(() => {
    document.getElementById("result-box").classList.remove("hidden");
    setTimeout(() => document.getElementById("c1").classList.add("reveal"), 100);
    setTimeout(() => document.getElementById("c2").classList.add("reveal"), 400);
    setTimeout(() => document.getElementById("c3").classList.add("reveal"), 700);
  }, 1500);
});
</script>
</body>
</html>
